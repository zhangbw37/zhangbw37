<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书商城</title>
    <link rel="stylesheet" href="lab2-2503-112-index.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/logo.jpg" alt="logo">
        </div>
        <nav class="nav">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">文学</a></li>
                <li><a href="#">科技</a></li>
                <li><a href="#">教育</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="javascript:openLogin()" id="loginBtn">登录</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside class="left">
            <h3>图书分类</h3>
            <ul>
                <li>小说文学</li>
                <li>历史传记</li>
                <li>计算机</li>
                <li>考试教材</li>
                <li>少儿读物</li>
            </ul>
        </aside>

        <main class="middle">
            <div class="book-show">
                <div class="book-item">
                    <img src="img/1.jpg" alt="图书封面">
                    <div class="book-tip">热销中</div>
                </div>
            </div>

            <div class="hot">
                <h3>热门推荐</h3>
                <div class="hot-item">
                    <img src="img/2.jpg" alt="">
                    <div class="book-info">
                        <p class="author">作者：老舍</p>
                        <p class="honor">京味白话文小说代表作</p>
                    </div>
                </div>
                <div class="hot-item">
                    <img src="img/4.jpg" alt="">
                    <div class="book-info">
                        <p class="author">作者：余华</p>
                        <p class="honor">豆瓣高分经典作品</p>
                    </div>
                </div>
                <div class="hot-item">
                    <img src="img/3.jpg" alt="">
                    <div class="book-info">
                        <p class="author">作者：刘慈欣</p>
                        <p class="honor">雨果奖获奖作品</p>
                    </div>
                </div>
            </div>

            <div class="new-book">
                <h3>新书上市</h3>
                <table border="1">
                    <tr>
                        <th>书名</th>
                        <th>价格</th>
                        <th>出版社</th>
                    </tr>
                    <tr>
                        <td>HTML从入门到精通</td>
                        <td>59元</td>
                        <td>科技出版社</td>
                    </tr>
                    <tr>
                        <td>CSS设计模式</td>
                        <td>49元</td>
                        <td>教育出版社</td>
                    </tr>
                </table>
            </div>
        </main>

        <aside class="right">
            <div class="ad">
                <h3>促销活动</h3>
                <p>满100减20</p>
                <p>会员享8折</p>
            </div>
        </aside>
    </div>

    <div class="login-wrap" id="loginWrap">
        <div class="login-box" id="loginBox">
            <div class="close" onclick="closeLogin()">×</div>
            <div class="tab">
                <div onclick="showLogin()">登录</div>
                <div onclick="showRegister()">注册</div>
            </div>
            <div id="loginForm">
                <input type="text" id="loginUser" placeholder="用户名"><br>
                <input type="password" id="loginPwd" placeholder="密码"><br>
                <button onclick="userLogin()">登录</button>
                <p id="loginTip"></p>
            </div>
            <div id="registerForm" style="display:none;">
                <input type="text" id="regUser" placeholder="用户名"><br>
                <input type="password" id="regPwd" placeholder="密码"><br>
                <button onclick="userRegister()">注册</button>
                <p id="regTip"></p>
            </div>
        </div>
    </div>

<script>
function openLogin(){
    document.getElementById('loginWrap').style.display = 'block';
}

function closeLogin(){
    document.getElementById('loginWrap').style.display = 'none';
}

function showLogin(){
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
}

function showRegister(){
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
}

function userRegister(){
    let user = document.getElementById('regUser').value;
    let pwd = document.getElementById('regPwd').value;

    if(!user || !pwd){
        document.getElementById('regTip').innerText = "请输入完整信息";
        return;
    }

    let userInfo = {user:user, pwd:pwd};
    localStorage.setItem('user', JSON.stringify(userInfo));
    document.getElementById('regTip').innerText = "注册成功！请登录";
}

function userLogin(){
    let user = document.getElementById('loginUser').value;
    let pwd = document.getElementById('loginPwd').value;

    let localUser = JSON.parse(localStorage.getItem('user'));

    if(!localUser){
        document.getElementById('loginTip').innerText = "用户未注册";
        return;
    }

    if(localUser.user === user && localUser.pwd === pwd){
        alert("登录成功！");
        document.getElementById('loginBtn').innerText = "欢迎，" + user;
        closeLogin();
    }else{
        document.getElementById('loginTip').innerText = "用户名或密码错误";
    }
}
</script>

</body>
</html>
