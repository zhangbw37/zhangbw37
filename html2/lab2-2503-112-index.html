<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书商城</title>
    <link rel="stylesheet" href="lab2-2503-112-index.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/logo.jpg" alt="logo">
        </div>
        <nav class="nav">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">文学</a></li>
                <li><a href="#">科技</a></li>
                <li><a href="#">教育</a></li>
                <li><a href="#">关于我们</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside class="left">
            <h3>图书分类</h3>
            <ul>
                <li>小说文学</li>
                <li>历史传记</li>
                <li>计算机</li>
                <li>考试教材</li>
                <li>少儿读物</li>
            </ul>
        </aside>

        <main class="middle">
            <div class="book-show">
                <div class="book-item">
                    <img src="img/1.jpg" alt="图书封面">
                    <div class="book-tip">热销中</div>
                </div>
            </div>

           <div class="hot">
    <h3>热门推荐</h3>
    <div class="hot-item">
        <img src="img/2.jpg" alt="">
       <div class="book-info">
            <p class="author">作者：老舍</p>
            <p class="honor">京味白话文小说代表作</p>
        </div>
    </div>
    <div class="hot-item">
        <img src="img/4.jpg" alt="">
       <div class="book-info">
            <p class="author">作者：余华</p>
            <p class="honor">豆瓣高分经典作品</p>
    </div>
    </div>
    <div class="hot-item">
        <img src="img/3.jpg" alt="">
     <div class="book-info">
            <p class="author">作者：刘慈欣</p>
            <p class="honor">雨果奖获奖作品</p>
        </div>
    </div>
</div>

            <div class="new-book">
                <h3>新书上市</h3>
                <table border="1">
                    <tr>
                        <th>书名</th>
                        <th>价格</th>
                        <th>出版社</th>
                    </tr>
                    <tr>
                        <td>HTML从入门到精通</td>
                        <td>59元</td>
                        <td>科技出版社</td>
                    </tr>
                    <tr>
                        <td>CSS设计模式</td>
                        <td>49元</td>
                        <td>教育出版社</td>
                    </tr>
                </table>
            </div>
        </main>

        <aside class="right">
            <div class="ad">
                <h3>促销活动</h3>
                <p>满100减20</p>
                <p>会员享8折</p>
            </div>
        </aside>
    </div>
</body>
</html>
